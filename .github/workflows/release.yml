name: Release

# Push a tag like v0.2.0 (matching package.json) to build, verify and publish
# a GitHub release with the store-ready zips (Chromium and Firefox) attached.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: npm run check
      - run: npx playwright install --with-deps chromium && npm run e2e
      - run: npm run package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "4ntl-${GITHUB_REF_NAME}.zip" "4ntl-firefox-${GITHUB_REF_NAME}.zip" --title "4NTL ${GITHUB_REF_NAME}" --generate-notes
